[build]
  publish = "site"

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'none'"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/install/*"
  to = "https://chromewebstore.google.com/detail/leggio/daehfmnbiigjkpmjldpjeleepoidmfdl"
  status = 302

[[redirects]]
  from = "/download/*"
  to = "https://chromewebstore.google.com/detail/leggio/daehfmnbiigjkpmjldpjeleepoidmfdl"
  status = 302
